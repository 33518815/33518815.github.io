    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        :root { --main-navy: #1a2a3a; --accent-gold: #c5a059; }
        body { font-family: 'Noto Sans KR', sans-serif; margin: 0; padding: 0; background: #fff; line-height: 1.6; }
        /* 상단 바 */

        .symbol { width: 60px; height: 60px; border: 4px solid var(--accent-gold); border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 15px; font-size: 2rem; font-weight: 900; color: var(--accent-gold); }
        /* 버튼 디자인 */
        .btn-zone { display: flex; justify-content: center; gap: 20px; padding: 50px 20px; flex-wrap: wrap; }
        .box { width: 300px; padding: 40px 20px; border: 1px solid #ddd; border-radius: 15px; text-align: center; text-decoration: none; color: #333; transition: 0.3s; }
        .box:hover { transform: translateY(-10px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); border-color: var(--accent-gold); }
        .box h3 { font-size: 1.5rem; color: var(--main-navy); }
    </style>
</head>
