<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공감 탐정·행정사 사무소 | 메인</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        :root { --main-navy: #0a192f; --accent-gold: #c5a059; }
        body { font-family: 'Noto Sans KR', sans-serif; margin: 0; padding: 0; background: #fff; line-height: 1.6; color: #333; }
        
        /* 통합 상단바 */
        .global-nav { background: #050a14; padding: 15px; text-align: center; border-bottom: 3px solid var(--accent-gold); position: sticky; top: 0; z-index: 1000; }
        .global-nav a { color: #fff; margin: 0 15px; text-decoration: none; font-weight: 700; font-size: 0.95rem; transition: 0.3s; }
        .global-nav a:hover { color: var(--accent-gold); }
        .nav-active { color: var(--accent-gold) !important; border-bottom: 2px solid var(--accent-gold); padding-bottom: 5px; }

        header { background: linear-gradient(135deg, #0a192f 0%, #112240 100%); color: #fff; padding: 70px 20px; text-align: center; border-bottom: 6px solid var(--accent-gold); }
        .symbol { width: 65px; height: 65px; margin: 0 auto 20px; border: 4px solid var(--accent-gold); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 2.2rem; font-weight: 900; color: var(--accent-gold); }
        .header-title { font-size: 2.5rem; font-weight: 900; margin: 0; }
        
        .container { max-width: 1100px; margin: auto; padding: 60px 20px; }
        .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        @media (max-width: 768px) { .main-grid { grid-template-columns: 1fr; } }
        
        .card { background: #fff; border: 1px solid #eee; border-radius: 20px; padding: 40px; text-align: center; transition: 0.3s; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-decoration: none; color: inherit; }
        .card:hover { transform: translateY(-10px); border-color: var(--accent-gold); }
        .card h3 { font-size: 1.7rem; color: var(--main-navy); margin-bottom: 15px; }
        .btn { display: inline-block; margin-top: 20px; padding: 12px 30px; background: var(--main-navy); color: #fff; border-radius: 50px; font-weight: 700; text-decoration: none; }
        
        footer { background: #050a14; color: #888; padding: 50px 20px; text-align: center; font-size: 0.85rem; }
    </style>
</head>
<body>
    <nav class="global-nav">
        <a href="index.html" class="nav-active">🏠 메인</a>
        <a href="admin_relief.html">⚖️ 행정심판 전문</a>
        <a href="visa.html">✈️ 비자·아포스티유</a>
    </nav>
    <header>
        <div class="symbol">G</div>
        <h1 class="header-title">공감 탐정·행정사 사무소</h1>
        <p style="color:var(--accent-gold); font-size:1.2rem;">진실을 찾는 탐정의 눈과 권익을 지키는 행정사의 마음</p>
    </header>
    <div class="container">
        <div class="main-grid">
            <a href="admin_relief.html" class="card">
                <h3>⚖️ 행정심판 전문센터</h3>
                <p>음주운전, 영업정지, 학교폭력 등<br>전문 행정 구제 및 서류 대행</p>
                <span class="btn">행정사 영역 보기</span>
            </a>
            <a href="visa.html" class="card">
                <h3>✈️ 비자·아포스티유</h3>
                <p>외국인 체류, 비자 발급, 아포스티유<br>글로벌 행정 서비스 지원</p>
                <span class="btn" style="background:#2d1b18;">비자 영역 보기</span>
            </a>
        </div>
    </div>
    <footer>
        <p>서울특별시 종로구 우정국로 39, 401호 | 대표전화: 010-8128-1079</p>
    </footer>
</body>
</html>
